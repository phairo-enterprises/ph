# Isolated artifact-only CI. The installer output is not executed or deployed.
name: Build diagnostic Comma installer (artifact only)
"on":
  push:
    branches:
      - comma4-installer-diagnostics-ci-v1
    paths:
      - .github/workflows/build-installer-arm64.yml
      - installer-repair/source-built-i3.patch
      - installer-repair/verify_installer_static.py
permissions:
  contents: read
jobs:
  installer:
    # The dedicated branch/path trigger isolates the task. Repairs/retries remain
    # limited by the separately approved artifact-only build scope.
    if: github.repository == 'phairo-enterprises/ph'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: repair-input
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: phairo-enterprises/ph
          ref: f66e80a4c58380aaa0252c9dd1c1f8cdaea5bb66
          path: source
          submodules: recursive
          lfs: false
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: commaai/agnos-builder
          ref: a0ec3fe3a6159742e45d569d96dd59c768d15fac
          path: agnos
          submodules: recursive
          lfs: true
          persist-credentials: false
      - name: Verify native runner and apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in aarch64|arm64) ;; *) echo 'Native ARM64 runner required for this draft'; exit 1;; esac
          test "$(git -C repair-input rev-parse HEAD)" = "$GITHUB_SHA"
          docker version
          docker buildx version
          test "$(git -C source rev-parse HEAD)" = f66e80a4c58380aaa0252c9dd1c1f8cdaea5bb66
          test "$(git -C agnos rev-parse HEAD)" = a0ec3fe3a6159742e45d569d96dd59c768d15fac
          test -f repair-input/installer-repair/source-built-i3.patch
          echo "ea5fe8c88c10fd3e330f1b6beb14a98ac00ed86bca863bafa8ac2982a655f237  repair-input/installer-repair/source-built-i3.patch" | sha256sum --check
          git -C source apply --check "$GITHUB_WORKSPACE/repair-input/installer-repair/source-built-i3.patch"
          git -C source apply "$GITHUB_WORKSPACE/repair-input/installer-repair/source-built-i3.patch"
          git -C source diff --check
          echo "e95f52f6bedd736b3fd11f7c4a0fb446f7eeb5bf3e788953a038c05fa10c7b69  source/openpilot/selfdrive/ui/installer/installer.cc" | sha256sum --check
          echo "0a9858eff45de0e6b67e8ab420266128bdd8c1666e1160d9bf60aafe33b1c72d  source/openpilot/selfdrive/ui/installer/git_progress.h" | sha256sum --check
          git -C source lfs pull --exclude=openpilot/selfdrive/modeld/models/big_driving_supercombo.onnx
      - name: Build official AGNOS kernel headers and build-image context
        working-directory: agnos
        shell: bash
        run: |
          set -euo pipefail
          # Official native-ARM script; its kernel output is never flashed or uploaded.
          ./build_kernel.sh
          test -d output/linux-headers/include
      - name: Build installer inside AGNOS 19.7 and export only installer/report files
        working-directory: agnos
        shell: bash
        run: |
          set -euo pipefail
          base=ubuntu-base-24.04.3-base-arm64.tar.gz
          curl --fail --location --retry 3 \
            "https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/$base" -o "$base"
          echo "7b2dced6dd56ad5e4a813fa25c8de307b655fdabc6ea9213175a92c48dabb048  $base" | sha256sum --check
          python3 - <<'PY_DOCKER'
          from pathlib import Path
          original = Path("Dockerfile.agnos").read_text()
          anchor = "\nFROM agnos-base\n"
          assert original.count(anchor) == 1, "Unexpected official final-stage layout"
          Path("Dockerfile.installer").write_text(original.replace(anchor, "\nFROM agnos-base AS installer-agnos-base\n"))
          PY_DOCKER
          cat >> Dockerfile.installer <<'DOCKERFILE_INSTALLER'

          # Compile in the official AGNOS stage; export only the two selected output files.
          FROM installer-agnos-base AS installer-build
          RUN install -d -o comma -g comma /src
          COPY --from=installer-source --chown=comma:comma / /src/
          WORKDIR /src
          USER comma:comma
          ENV HOME=/src/.installer-build-home \
              PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin \
              UV_CACHE_DIR=/src/.installer-uv-cache \
              UV_PROJECT_ENVIRONMENT=/src/.venv \
              UV_PYTHON_INSTALL_DIR=/src/.installer-build-home/.local/share/uv/python \
              UV_LINK_MODE=copy \
              TMPDIR=/src/.installer-build-tmp
          SHELL ["/bin/bash", "-o", "pipefail", "-c"]
          RUN set -eu; \
              test "$(id -un)" = comma; test "$(id -u)" != 0; \
              mkdir -p "$HOME" "$TMPDIR"; \
              test "$(uname -m)" = aarch64; test -f /AGNOS; \
              test "$(cat /VERSION)" = 19.7; test -w "$HOME"; test -w /src; \
              command -v clang; command -v clang++; command -v uv; \
              { printf "BUILD_IMAGE_VERSION="; cat /VERSION; cat /etc/os-release; \
                getconf GNU_LIBC_VERSION; clang --version; uv --version; id; \
              } > /src/installer-build-environment.txt; \
              uv sync --frozen --all-extras; \
              export PATH="/src/.venv/bin:$PATH"; \
              command -v capnpc; command -v python3; \
              .venv/bin/scons --minimal --comma-installer-i3 -j2 \
                cache_dir=/src/.installer-scons-cache \
                openpilot/selfdrive/ui/installer/installers/installer_phairo_i3

          FROM scratch AS installer-artifact
          COPY --from=installer-build /src/openpilot/selfdrive/ui/installer/installers/installer_phairo_i3 /installer_phairo_i3
          COPY --from=installer-build /src/installer-build-environment.txt /installer-build-environment.txt
          DOCKERFILE_INSTALLER
          # Normal BuildKit sandbox. No privileged flags, image load/export, or installer execution.
          docker buildx build --platform linux/arm64 --target installer-artifact \
            --build-arg "UBUNTU_BASE_IMAGE=$base" \
            --build-context "installer-source=$GITHUB_WORKSPACE/source" \
            --output "type=local,dest=$GITHUB_WORKSPACE/installer-output,platform-split=false" \
            -f Dockerfile.installer .
      - name: Static artifact checks and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          file=installer-output/installer_phairo_i3
          test -f "$file"
          readelf -h "$file" | tee artifacts/elf-header.txt
          readelf -d "$file" > artifacts/elf-dynamic.txt
          readelf -l "$file" > artifacts/elf-program-headers.txt
          readelf --version-info --wide "$file" > artifacts/elf-symbol-versions.txt
          cp installer-output/installer-build-environment.txt artifacts/
          readelf -h "$file" | grep -q 'Machine:.*AArch64'
          python3 repair-input/installer-repair/verify_installer_static.py "$file"
          cp "$file" artifacts/installer_phairo_i3.EXPERIMENTAL
          chmod 0644 artifacts/installer_phairo_i3.EXPERIMENTAL
          sha256sum artifacts/installer_phairo_i3.EXPERIMENTAL > artifacts/SHA256SUMS
          printf '%s\n' \
            'WORKFLOW_BASE=8b5ce72d6a5804f2282120da2c2963524305f244' \
            'DIAGNOSTIC_SOURCE_SHA256=e95f52f6bedd736b3fd11f7c4a0fb446f7eeb5bf3e788953a038c05fa10c7b69' \
            'DIAGNOSTIC_HEADER_SHA256=0a9858eff45de0e6b67e8ab420266128bdd8c1666e1160d9bf60aafe33b1c72d' \
            'SOURCE=f66e80a4c58380aaa0252c9dd1c1f8cdaea5bb66' \
            'AGNOS_BUILDER=a0ec3fe3a6159742e45d569d96dd59c768d15fac' \
            'REPOSITORY=https://github.com/phairo-enterprises/ph.git' \
            'BRANCH=comma4-accord26-all-v2' \
            'EXPECTED_SOURCE_AGNOS=19.7' \
            'BUILD_IMAGE_AGNOS=19.7' \
            'DEVICE_AGNOS=UNKNOWN' \
            'ABI_NOT_VERIFIED' \
            'NOT_EXECUTED_OR_DEVICE_TESTED; NOT_PUBLISHED_TO_INSTALLER_URL' > artifacts/BUILD-MANIFEST.txt
          git -C source diff --stat >> artifacts/BUILD-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: comma-diagnostic-installer-native-arm64-UNTESTED
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
